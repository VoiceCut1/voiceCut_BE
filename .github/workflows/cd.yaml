name: CD

on:
  push:
    branches: [ deploy ]
  pull_request:
    branches: [ deploy ]

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create Directory for Firebase Key
        run: |
          mkdir -p src/main/resources/key
      - name: Copy Firebase Key to Build Context
        run: |
          cp /home/admin/voice-cut-1/fcmKey.json src/main/resources/key/fcmKey.json
      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew
      - name: Build with Gradle
        run: ./gradlew build -x test
      - name: Build Docker Image
        run: |
          sudo docker build -f ./docker/voice-cut-1_prod/Dockerfile -t spring-app:latest .
      - name: Upload Docker Image as Artifact
        uses: actions/upload-artifact@v3
        with:
          name: spring-app-image
          path: spring-app.tar

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Download Docker Image Artifact
        uses: actions/download-artifact@v3
        with:
          name: spring-app-image
      - name: Stop Existing Container
        run: |
          sudo docker rm -f spring-app || echo "No container running"
      - name: Remove Dangling Images
        run: |
          sudo docker images -f "dangling=true" -q | xargs -r sudo docker rmi
      - name: Run Docker Container
        run: |
          sudo docker run -d \
            --name spring-app \
            --network voice-cut-1 \
            -p 8080:8080 \
            --env-file /home/admin/voice-cut-1/.env \
            spring-app:latest
